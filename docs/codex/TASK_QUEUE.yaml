meta:
  version: 1
  branch_policy: "work only on codex/* branches"
  task_selection_rule: "pick the highest-priority task with status pending and no incomplete dependencies"
  commit_policy: "complete one closed-loop task, validate, update docs, commit, push"
  current_focus: "H1 completed by classifying the repo-root pipmaster shim as a local runtime artifact and ignoring it, so the codex/lightrag worktree returns to an explainable baseline after G1"

tasks:
  - id: A0
    title: "Bootstrap Codex operating model"
    priority: 1
    status: completed
    depends_on: []
    area: "repo-operations"
    problem_statement: "Codex does not yet have durable repo-level memory, task selection, or acceptance criteria inside the repository."
    root_cause_hypothesis: "Project instructions, architecture context, and acceptance standards are still conversational instead of repo-native."
    definition_of_done:
      - "AGENTS.md points to docs/codex as the source of truth"
      - "PROJECT_BRIEF, SYSTEM_MAP, CONTRACTS, QUALITY_GATES, DECISIONS, RUNBOOK, and TASK_QUEUE exist"
      - "A baseline CI workflow and local quality script exist"
    validation_commands:
      - "python scripts/quality_gate.py --profile python"
    risk_level: "medium"
    expected_files:
      - "AGENTS.md"
      - "docs/codex/*"
      - "scripts/quality_gate.py"
      - ".github/workflows/quality-gates.yml"
    notes:
      - "Bootstrap task completed by codex/lightrag operating model setup."

  - id: A1
    title: "Absorb active worktree into a documented engineering baseline"
    priority: 2
    status: completed
    depends_on: [A0]
    area: "baseline"
    problem_statement: "The branch already contains local changes, but they are not yet summarized as the active engineering baseline."
    root_cause_hypothesis: "The repo lacks a single documented snapshot of what changed before the larger optimization work begins."
    definition_of_done:
      - "Current local modifications are summarized in DECISIONS or a dedicated baseline note"
      - "Bootstrap changes are committed separately from unrelated product changes"
      - "The next task queue reflects the real baseline"
    validation_commands:
      - "git status --short --branch"
    risk_level: "low"
    expected_files:
      - "docs/codex/DECISIONS.md"
      - "docs/codex/TASK_QUEUE.yaml"
    notes:
      - "Completed by recording the active storage-stack consolidation baseline in DCR-005."
      - "Bootstrap commits remain isolated in history while the dirty worktree is treated as the current product baseline."

  - id: B1
    title: "Split lightrag/lightrag.py by orchestration responsibility"
    priority: 3
    status: completed
    depends_on: [A1]
    area: "core-engine"
    problem_statement: "The main LightRAG orchestration file is too large and mixes multiple responsibilities."
    root_cause_hypothesis: "Configuration, orchestration, storage wiring, and query flow evolved in one file without clear seams."
    definition_of_done:
      - "A smaller orchestration entrypoint remains"
      - "At least one responsibility is extracted into a dedicated module with tests"
      - "Contracts and migration notes are updated if public imports change"
    validation_commands:
      - "python -m ruff check lightrag/lightrag.py lightrag/storage_wiring.py tests/test_storage_wiring.py"
      - "python -m pytest tests/test_chunking.py tests/test_write_json_optimization.py tests/test_storage_wiring.py -m \"not integration\""
    risk_level: "high"
    expected_files:
      - "lightrag/lightrag.py"
      - "lightrag/*"
      - "tests/*"
      - "docs/codex/DECISIONS.md"
    notes:
      - "Prefer extraction over alias-heavy compatibility wrappers."
      - "Completed by extracting storage class resolution and namespace wiring into lightrag/storage_wiring.py."
      - "Focused regression coverage lives in tests/test_storage_wiring.py."
      - "Validation is scoped to the touched seam because repo-wide Ruff still reports unrelated baseline lint debt outside B1."

  - id: B2
    title: "Split lightrag/operate.py into retrieval and indexing modules"
    priority: 4
    status: completed
    depends_on: [B1]
    area: "core-engine"
    problem_statement: "The operate module contains chunking, extraction, retrieval, and graph rebuild behavior in one place."
    root_cause_hypothesis: "Pipeline steps accumulated without intermediate module boundaries."
    definition_of_done:
      - "Retrieval and indexing concerns live in separate modules"
      - "Shared helpers move to explicit utility modules or protocols"
      - "Touched behavior is covered by focused tests"
    validation_commands:
      - "python -m ruff check lightrag/operate.py lightrag/indexing.py lightrag/retrieval.py lightrag/lightrag.py tests/test_chunking.py tests/test_operate_split.py"
      - "python -m pytest tests/test_chunking.py tests/test_write_json_optimization.py tests/test_operate_split.py -m \"not integration\""
    risk_level: "high"
    expected_files:
      - "lightrag/operate.py"
      - "lightrag/*"
      - "tests/*"
    notes:
      - "Completed by moving indexing/chunking concerns into lightrag/indexing.py and retrieval/query concerns into lightrag/retrieval.py."
      - "lightrag/operate.py remains a thin compatibility facade so existing imports stay stable."
      - "Validation is scoped to the touched seam because repo-wide Ruff still reports unrelated baseline lint debt outside B2."

  - id: C1
    title: "Define shared storage adapter contracts"
    priority: 5
    status: completed
    depends_on: [B2]
    area: "storage"
    problem_statement: "Storage implementations diverge in initialization, error handling, and capability expression."
    root_cause_hypothesis: "Adapters were added incrementally without a strict shared contract."
    definition_of_done:
      - "Common adapter expectations are explicit"
      - "At least one contract-focused test suite exists for touched adapters"
      - "Provider-specific duplication is reduced"
    validation_commands:
      - "python -m ruff check lightrag/kg/storage_contracts.py lightrag/kg/chroma_impl.py lightrag/kg/postgres_impl.py lightrag/kg/neo4j_impl.py tests/test_storage_contracts.py"
      - "python -m pytest tests/test_chroma_storage.py tests/test_storage_contracts.py -m \"not integration\""
    risk_level: "high"
    expected_files:
      - "lightrag/kg/*"
      - "tests/*"
      - "docs/codex/CONTRACTS.md"
    notes:
      - "Target protocol clarity before broad implementation churn."
      - "Completed by extracting shared workspace resolution into lightrag/kg/storage_contracts.py and rewiring PostgreSQL, Chroma, and Neo4j to use explicit precedence chains."
      - "Focused contract coverage lives in tests/test_storage_contracts.py, with tests/test_chroma_storage.py kept green as adapter regression coverage."
      - "Validation is scoped to the touched adapter seam because repo-wide Ruff still reports unrelated baseline lint debt outside C1."

  - id: D1
    title: "Split API app factory and route composition"
    priority: 6
    status: completed
    depends_on: [C1]
    area: "api"
    problem_statement: "The FastAPI entrypoint mixes startup concerns, config handling, and route composition."
    root_cause_hypothesis: "App composition grew inside a single module."
    definition_of_done:
      - "App factory and route registration live in separate modules"
      - "Auth and dependency setup are clearer"
      - "Contracts reflect the new structure"
    validation_commands:
      - "python -m ruff check lightrag/api/lightrag_server.py lightrag/api/route_registry.py tests/test_route_registry.py"
      - "python -m pytest tests/test_route_registry.py -q"
    risk_level: "high"
    expected_files:
      - "lightrag/api/lightrag_server.py"
      - "lightrag/api/*"
      - "docs/codex/CONTRACTS.md"
    notes:
      - "Protect externally visible route paths unless a migration is recorded."
      - "Completed by extracting route assembly, auth/status endpoints, health route registration, and static mounts into lightrag/api/route_registry.py while keeping create_app() in lightrag/api/lightrag_server.py."
      - "Focused API coverage lives in tests/test_route_registry.py."
      - "Validation is scoped to the touched API seam because repo-wide Ruff still reports unrelated baseline lint debt outside D1."

  - id: D2
    title: "Trim Web UI to core user journeys"
    priority: 7
    status: completed
    depends_on: [D1]
    area: "webui"
    problem_statement: "The Web UI needs clearer ownership of state and stronger focus on the core product flows."
    root_cause_hypothesis: "Feature growth happened without a formal simplification pass."
    definition_of_done:
      - "Primary tabs and state flows are documented and simplified"
      - "Unused or redundant UI paths are removed"
      - "The app still builds cleanly"
    validation_commands:
      - "bun install --cwd lightrag_webui --frozen-lockfile"
      - "bun --cwd lightrag_webui run build"
    risk_level: "medium"
    expected_files:
      - "lightrag_webui/src/*"
      - "docs/codex/CONTRACTS.md"
    notes:
      - "Prefer user-journey clarity over sweeping visual redesign."
      - "Completed by centralizing the four primary tabs in lightrag_webui/src/lib/appTabs.ts, making the persisted currentTab store the single source of truth for Radix Tabs, and removing the redundant TabVisibility context and unused TabContent path."
      - "ApiSite now relies on the force-mounted Radix tab shell instead of a parallel visibility context, so the Swagger iframe stays warm without extra state ownership."

  - id: E1
    title: "Add performance benchmark harness and final acceptance report"
    priority: 8
    status: completed
    depends_on: [D2]
    area: "performance"
    problem_statement: "The repo does not yet have a durable benchmark and acceptance reporting loop for the optimized architecture."
    root_cause_hypothesis: "Performance checks and structural acceptance are still ad hoc."
    definition_of_done:
      - "Baseline benchmark commands are defined"
      - "Performance results can be compared across iterations"
      - "Final acceptance notes are documented"
    validation_commands:
      - "python scripts/quality_gate.py --profile phase-a"
    risk_level: "medium"
    expected_files:
      - "docs/codex/QUALITY_GATES.md"
      - "docs/codex/DECISIONS.md"
      - "scripts/*"
    notes:
      - "This task closes the optimization program, not just a single code change."
      - "Completed by extending scripts/quality_gate.py so the phase-a profile measures each baseline command, writes `docs/codex/benchmarks/phase_a_latest.json`, appends `docs/codex/benchmarks/phase_a_history.jsonl`, and regenerates `docs/codex/ACCEPTANCE_REPORT.md`."
      - "Validation ran through `python scripts/quality_gate.py --profile phase-a`, which passed with the generated artifacts recorded from the current branch tip."

  - id: F1
    title: "Converge the documented storage stack on Postgres + Chroma + Neo4j"
    priority: 9
    status: completed
    depends_on: [E1]
    area: "storage"
    problem_statement: "Storage defaults, registry validation, deployment docs, and migration guidance drifted apart while the branch converged on a single production storage stack."
    root_cause_hypothesis: "The codebase still treated storage selection as open-ended even after the intended runtime baseline moved to Postgres for documents/status, Chroma for vectors, and Neo4j for graphs."
    definition_of_done:
      - "Default storage selection surfaces point to `PGKVStorage + PGDocStatusStorage + ChromaVectorDBStorage + Neo4JStorage`"
      - "Storage registry and PostgreSQL bootstrap only expose or manage tables for the intended production stack"
      - "Legacy local storage has a documented migration path into the production stack"
      - "Focused regression tests lock the storage-stack contract"
    validation_commands:
      - "python -m ruff check lightrag/api/config.py lightrag/kg/__init__.py lightrag/kg/chroma_impl.py lightrag/kg/postgres_impl.py lightrag/tools/migrate_to_pg_chroma_neo4j.py tests/test_chroma_storage.py tests/test_graph_storage.py tests/test_storage_contracts.py tests/test_storage_stack_defaults.py"
      - "python -m pytest tests/test_chroma_storage.py tests/test_storage_contracts.py tests/test_storage_stack_defaults.py -m \"not integration\""
    risk_level: "high"
    expected_files:
      - "README.md"
      - "README-zh.md"
      - "config.ini.example"
      - "docker-compose.yml"
      - "env.example"
      - "lightrag/api/README.md"
      - "lightrag/api/README-zh.md"
      - "lightrag/api/config.py"
      - "lightrag/kg/__init__.py"
      - "lightrag/kg/postgres_impl.py"
      - "lightrag/tools/migrate_to_pg_chroma_neo4j.py"
      - "pyproject.toml"
      - "requirements-offline*.txt"
      - "tests/*"
      - "docs/codex/CONTRACTS.md"
      - "docs/codex/DECISIONS.md"
    notes:
      - "Completed by making the official storage contract explicit across runtime defaults, storage verification, deployment docs, and migration guidance."
      - "Focused regression coverage lives in tests/test_storage_stack_defaults.py, with tests/test_chroma_storage.py and tests/test_storage_contracts.py covering the touched adapter seam."
      - "Validation is scoped to the touched storage seam because repo-wide Ruff still reports unrelated baseline lint debt outside F1."

  - id: G1
    title: "Centralize pipmaster fallback on the supported runtime surface"
    priority: 10
    status: completed
    depends_on: [F1]
    area: "runtime-dependencies"
    problem_statement: "Supported runtime modules still hard-import `pipmaster`, which leaves source checkouts depending on a local shim when the package is not already installed."
    root_cause_hypothesis: "Optional dependency bootstrap logic evolved independently in API and storage modules, so the supported runtime surface never converged on one shared import boundary for `pipmaster`."
    definition_of_done:
      - "The supported runtime surface uses one shared helper to load `pipmaster` or a local fallback"
      - "The production API and storage modules no longer duplicate inline `pipmaster` import logic"
      - "Focused tests cover the fallback helper behavior"
    validation_commands:
      - "python -m ruff check lightrag/_pipmaster.py lightrag/api/lightrag_server.py lightrag/api/run_with_gunicorn.py lightrag/kg/chroma_impl.py lightrag/kg/neo4j_impl.py lightrag/kg/postgres_impl.py tests/test_pipmaster_fallback.py"
      - "python -m pytest tests/test_pipmaster_fallback.py -q"
    risk_level: "medium"
    expected_files:
      - "lightrag/_pipmaster.py"
      - "lightrag/api/*"
      - "lightrag/kg/*"
      - "tests/*"
      - "docs/codex/TASK_QUEUE.yaml"
      - "docs/codex/DECISIONS.md"
    notes:
      - "Keep scope on the supported runtime surface defined by the current contracts instead of sweeping every legacy adapter in one run."
      - "Completed by adding lightrag/_pipmaster.py as the shared import-or-install boundary and rewiring the active API, PostgreSQL, Chroma, and Neo4j modules to use it."
      - "Focused regression coverage lives in tests/test_pipmaster_fallback.py."

  - id: H1
    title: "Absorb the repo-root pipmaster shim as a local runtime artifact"
    priority: 11
    status: completed
    depends_on: [G1]
    area: "repo-hygiene"
    problem_statement: "After G1, the only remaining dirty-worktree artifact is an untracked repo-root `pipmaster.py` shim that is no longer part of the supported runtime path."
    root_cause_hypothesis: "The repository had no explicit ignore rule for the temporary root-level compatibility shim, so local runtime recovery artifacts still appeared as unexplained worktree changes."
    definition_of_done:
      - "The repo-root `pipmaster.py` shim is classified as a local artifact rather than pending product work"
      - "The standard worktree status is clean after the ignore rule is in place"
      - "Codex docs record why the ignore rule exists"
    validation_commands:
      - "git check-ignore -v pipmaster.py"
      - "git status --short --branch"
    risk_level: "low"
    expected_files:
      - ".gitignore"
      - "docs/codex/TASK_QUEUE.yaml"
      - "docs/codex/DECISIONS.md"
    notes:
      - "Completed by ignoring the obsolete repo-root pipmaster shim instead of deleting a local file from the user's machine."

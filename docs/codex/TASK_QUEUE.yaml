      - "lightrag/*"
      - "tests/*"
    notes:
      - "Completed by moving indexing/chunking concerns into lightrag/indexing.py and retrieval/query concerns into lightrag/retrieval.py."
      - "lightrag/operate.py remains a thin compatibility facade so existing imports stay stable."
      - "Validation is scoped to the touched seam because repo-wide Ruff still reports unrelated baseline lint debt outside B2."


    root_cause_hypothesis: "Configuration, orchestration, storage wiring, and query flow evolved in one file without clear seams."
    definition_of_done:
      - "A smaller orchestration entrypoint remains"
      - "At least one responsibility is extracted into a dedicated module with tests"
      - "Contracts and migration notes are updated if public imports change"
    validation_commands:
